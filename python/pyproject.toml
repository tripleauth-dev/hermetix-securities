[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermetix"
version = "0.11.2"
description = "증권사 모의투자 통합 트레이딩 프레임워크 - Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["trading", "paper-trading", "stock", "bot", "korea", "broker", "kis", "kiwoom", "websocket"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]

# 런타임 의존성 없음 - 표준 라이브러리만 사용한다
dependencies = []

[project.urls]
Homepage = "https://github.com/tripleauth-dev/hermetix-securities/tree/main/python"
Repository = "https://github.com/tripleauth-dev/hermetix-securities"
Issues = "https://github.com/tripleauth-dev/hermetix-securities/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "websockets>=12", "cryptography>=42"]
# 실시간 스트림 (kis/kiwoom 체결가·호가·주문통보) - 코어는 여전히 의존성 0. cryptography 는 KIS 주문 통보 AES 복호화용
stream = ["websockets>=12", "cryptography>=42"]

[tool.setuptools.packages.find]
include = ["hermetix*"]
exclude = ["tests*", "examples*"]
